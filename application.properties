# =========================================================
# GREEN BUS - CENTRALIZED APPLICATION CONFIGURATION
# =========================================================

# =========================================================
# 1. SHARED DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/centralized_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}


# =========================================================
# 2. EUREKA CONFIGURATION
# =========================================================

eureka.client.enabled=${EUREKA_ENABLED:true}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

eureka.instance.instance-id=${spring.application.name}:${server.port}


# =========================================================
# 3. FLYWAY CONFIGURATION - SERVICE-SPECIFIC HISTORY TABLE
# =========================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.table=${FLYWAY_HISTORY_TABLE:flyway_schema_history}

spring.flyway.baseline-on-migrate=true

spring.flyway.baseline-version=0


# =========================================================
# 4. JACKSON CONFIGURATION
# =========================================================

spring.jackson.default-property-inclusion=non_null

spring.jackson.deserialization.fail-on-unknown-properties=false

spring.jackson.serialization.write-dates-as-timestamps=false

spring.mvc.problemdetails.enabled=false


# =========================================================
# 5. JWT CONFIGURATION - ADMIN CONSOLE
# =========================================================

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

security.jwt.issuer=${JWT_ISSUER:GB-user-service}

security.jwt.audience=${JWT_AUDIENCE:greatbus-api}

# The audience is enforced only when this is true
security.jwt.validate-audience=${JWT_VALIDATE_AUDIENCE:true}


# =========================================================
# 6. TENANT CONFIGURATION
# =========================================================

admin.tenant.default-id=${ADMIN_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}

admin.tenant.claim=tenantId


# =========================================================
# 7. ADMIN RBAC CONFIGURATION
# =========================================================

admin.rbac.roles.SUPER_ADMIN=*

admin.rbac.roles.ADMIN=*

admin.rbac.roles.MANAGER=DASHBOARD_READ,BOOKING_READ,DRIVER_READ,ROUTE_READ,VEHICLE_READ,OFFER_READ,PAYMENT_READ,REPORT_READ,USER_READ,SUPPORT_READ,SETTINGS_READ,DRAFT_READ


# =========================================================
# 8. DOWNSTREAM MICROSERVICE URLs
# =========================================================

downstream.services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}

downstream.services.fleet-service.url=${FLEET_SERVICE_URL:http://localhost:8082}

downstream.services.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8083}

downstream.services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}

downstream.services.discount-service.url=${DISCOUNT_SERVICE_URL:http://localhost:8085}

downstream.services.reporting-service.url=${REPORTING_SERVICE_URL:http://localhost:8086}

downstream.services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}

downstream.timeout-ms=${DOWNSTREAM_TIMEOUT_MS:5000}


# =========================================================
# 9. OUTBOX RELAY CONFIGURATION
# =========================================================

outbox.kafka-enabled=${OUTBOX_KAFKA_ENABLED:false}

outbox.poll-ms=${OUTBOX_POLL_MS:2000}

outbox.batch-size=${OUTBOX_BATCH_SIZE:100}

outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}

outbox.backoff-base-ms=${OUTBOX_BACKOFF_BASE_MS:1000}

outbox.backoff-max-ms=${OUTBOX_BACKOFF_MAX_MS:300000}


# =========================================================
# 10. KAFKA CONFIGURATION
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all

spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:10000}


# =========================================================
# 11. ADMIN BUSINESS RULES
# =========================================================

admin.rules.permit-renewal-reminder-days=60

admin.rules.export-retention-days=7

admin.rules.max-document-bytes=5242880

admin.rules.allowed-document-types=application/pdf,image/jpeg

admin.rules.min-password-length=8


# =========================================================
# 12. ACTUATOR CONFIGURATION
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when-authorized


# =========================================================
# 13. LOGGING CONFIGURATION
# =========================================================

logging.level.root=INFO

logging.level.com.gb.admin=INFO


# =========================================================
# 14. DOWNSTREAM CLIENT CONFIGURATION
# =========================================================

downstream.client-id=${DOWNSTREAM_CLIENT_ID:admin-console}


# =========================================================
# 15. FILE STORAGE CONFIGURATION
# =========================================================

storage.type=${STORAGE_TYPE:local}

storage.local.directory=${STORAGE_LOCAL_DIR:}

storage.local.base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8092}

storage.local.signing-secret=${STORAGE_LOCAL_SECRET:}

storage.s3.bucket=${STORAGE_S3_BUCKET:}

storage.s3.region=${AWS_REGION:ap-south-1}

storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}

storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE:false}

storage.s3.kms-key-id=${STORAGE_S3_KMS_KEY_ID:}

# AES256 (AWS) or NONE (local MinIO)

storage.s3.server-side-encryption=${STORAGE_S3_SSE:AES256}


# =========================================================
# 16. DRIVER RULES
# =========================================================

admin.rules.min-driver-age=18

admin.rules.required-driver-documents=DRIVING_LICENCE,AADHAAR_CARD,PAN_CARD


# =========================================================
# 17. CAMPAIGN COST CONFIGURATION
# =========================================================

campaign.tariff.sms=${CAMPAIGN_TARIFF_SMS:}

campaign.tariff.currency=${CAMPAIGN_TARIFF_CURRENCY:INR}

campaign.min-schedule-lead-minutes=1


# =========================================================
# 18. SUPPORT CONFIGURATION
# =========================================================

support.sla.escalation-minutes=${SUPPORT_SLA_ESCALATION_MINUTES:}


# =========================================================
# 19. EXPORT AND REPORT CONFIGURATION
# =========================================================

admin.rules.export-max-rows=${EXPORT_MAX_ROWS:100000}

admin.jobs.export-worker-ms=${EXPORT_WORKER_MS:5000}

admin.jobs.export-max-attempts=3


# =========================================================
# 20. ADMIN CONSOLE SERVICE TOKEN
# =========================================================

service-token.service-id=${DOWNSTREAM_SERVICE_ID:admin-console-service}

service-token.secret=${ADMIN_CONSOLE_SERVICE_SECRET:}


# =========================================================
# 21. PUBLIC TICKET CONFIGURATION
# =========================================================

admin.tickets.public-link-secret=${TICKET_PUBLIC_LINK_SECRET:}

admin.tickets.public-base-url=${TICKET_PUBLIC_BASE_URL:http://localhost:8080}

admin.tickets.public-link-ttl-days=${TICKET_PUBLIC_LINK_TTL_DAYS:30}

admin.tickets.public-rate-per-minute=${TICKET_PUBLIC_RATE_PER_MINUTE:30}

admin.tickets.trust-forwarded-for=${TICKET_TRUST_FORWARDED_FOR:false}

admin.tickets.resend-min-seconds=${TICKET_RESEND_MIN_SECONDS:60}

# Ticket terms / instructions will be configured when approved.
# admin.tickets.terms[0]=...


# =========================================================
# 22. ADMIN BOOKING PAYMENT CONFIGURATION
# =========================================================

admin.payments.methods=${ADMIN_PAYMENT_METHODS:UPI,CARD,NETBANKING}

admin.payments.gateway-name=${ADMIN_PAYMENT_GATEWAY:PRIMARY_GATEWAY}

admin.payments.return-url=${ADMIN_PAYMENT_RETURN_URL:http://localhost:5173/admin/bookings/payment-return}

# Extra origins a returnUrl may point to (comma separated)

admin.payments.allowed-return-origins=${ADMIN_PAYMENT_RETURN_ORIGINS:}


# =========================================================
# 23. UPI CONFIGURATION
# =========================================================

admin.payments.upi.payee-vpa=${UPI_PAYEE_VPA:}

admin.payments.upi.payee-name=${UPI_PAYEE_NAME:GreatBus}

admin.payments.upi.qr-ttl-minutes=${UPI_QR_TTL_MINUTES:10}


# ==========================================================
# 24. ADMIN OPERATOR SERVICE CONFIGURATION
# ==========================================================

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT Configuration ---
security.jwt.jwk-set-uri=${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# --- Logging ---
logging.level.com.enterprise.admin=INFO

# --- Outbox Relay ---
outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:10000}

# --- Admin Bootstrap ---
admin.bootstrap.super-admin-user-uuid=${ADMIN_BOOTSTRAP_SUPER_ADMIN_UUID:}

# --- User Service ---
admin.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
admin.user-service.service-secret=${ADMIN_OPERATOR_SERVICE_SECRET:}

# --- Payout Configuration ---
payout.encryption-key=${PAYOUT_ENCRYPTION_KEY:}
payout.hold-hours=${PAYOUT_HOLD_HOURS:48}

# =====================================================
# BOOKING SERVICE CONFIGURATION
# =====================================================

# Redis / Redlock
booking.redis.address=redis://localhost:6379

# Booking domain
booking.hold.duration-seconds=300
booking.sweeper.interval-ms=30000

# Kafka producer
booking.kafka.topic.held=booking.held
booking.kafka.topic.confirmed=booking.confirmed
booking.kafka.topic.confirm-rejected=booking.confirm.rejected
booking.kafka.topic.expired=booking.expired
booking.kafka.topic.cancelled=booking.cancelled

# Booking event contract topics
booking.kafka.topic.created=booking.created
booking.kafka.topic.confirmed-contract=booking.confirmed.v1
booking.kafka.topic.failed=booking.failed
booking.kafka.topic.expired-contract=booking.expired.v1
booking.kafka.topic.modified=booking.modified
booking.kafka.topic.seat-locked=seat.locked
booking.kafka.topic.seat-released=seat.released
booking.kafka.topic.seat-availability-low=seat.availability.low
booking.kafka.topic.overbooking-detected=overbooking.detected
booking.kafka.topic.bus-full=bus.full
booking.kafka.topic.trip-completed=trip.completed
booking.kafka.topic.boarding-completed=boarding.completed
booking.kafka.topic.cancelled-by-admin=booking.cancelled.admin

booking.kafka.relay.interval-ms=5000
booking.kafka.relay.batch-size=200
booking.kafka.relay.max-attempts=5

# Pricing
booking.pricing.commission-percent=10.00
booking.pricing.platform-fee=25.00
booking.pricing.gst-rate-percent=5.00
booking.pricing.service-gst-rate-percent=18.00

# External services
booking.fx.usd-inr-url=${FX_URL:https://open.er-api.com/v6/latest/USD}
booking.fx.cache-ttl-minutes=${FX_CACHE_TTL_MINUTES:720}

booking.payment-service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084/api/v1}
booking.fleet-service.base-url=${FLEET_SERVICE_BASE_URL:http://localhost:8082}
booking.admin-operator.base-url=${ADMIN_OPERATOR_SERVICE_URL:http://localhost:8088}

user-service.url=${USER_SERVICE_URL:http://localhost:8081}
user-service.client-id=${USER_SERVICE_CLIENT_ID:booking-service}
user-service.service-secret=${SERVICE_CLIENT_BOOKING_SECRET}

# Ticket configuration
booking.ticket.public-base-url=${TICKET_PUBLIC_BASE_URL:http://localhost:8083}
booking.ticket.signing-secret=${TICKET_SIGNING_SECRET}
booking.ticket.public-url-ttl-hours=${TICKET_PUBLIC_URL_TTL_HOURS:48}
booking.ticket.terms=${TICKET_TERMS:}
booking.ticket.support-phone=${TICKET_SUPPORT_PHONE:}
booking.ticket.support-email=${TICKET_SUPPORT_EMAIL:}
booking.ticket.brand-name=${TICKET_BRAND_NAME:GreatBus}
booking.ticket.brand-tagline=${TICKET_BRAND_TAGLINE:Travel & Logistics}

# Booking limits
booking.hold.max-seats-per-booking=${BOOKING_MAX_SEATS_PER_BOOKING:5}
booking.hold.max-active-holds-per-user=${BOOKING_MAX_ACTIVE_HOLDS_PER_USER:10}

# Late payment
booking.late-payment.window-minutes=${BOOKING_LATE_PAYMENT_WINDOW_MINUTES:30}
booking.late-payment.confirm-hold-seconds=${BOOKING_LATE_PAYMENT_CONFIRM_HOLD_SECONDS:120}

# Account deletion events
account.deletion.kafka.topic.requested=account.deletion.requested
account.deletion.kafka.topic.completed=account.deletion.completed
account.deletion.kafka.consumer.group-id=booking-service-account-deletion
account.deletion.kafka.relay.interval-ms=5000
account.deletion.kafka.relay.batch-size=200
account.deletion.kafka.relay.max-attempts=5

# Kafka consumer
spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:GB-user-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:greatbus-api}

security.strict-secrets=${SECURITY_STRICT_SECRETS:}
security.guarded-properties=${SECURITY_GUARDED_PROPERTIES:booking.ticket.signing-secret,user-service.service-secret}
security.insecure-markers=${SECURITY_INSECURE_MARKERS:CHANGE_ME,local-dev-only,dev-only,changeme}

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.parser.strict-duplicate-detection=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# Logging
logging.level.com.enterprise.booking=INFO

