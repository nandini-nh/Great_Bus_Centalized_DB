# =========================================================
# 22. ADMIN BOOKING PAYMENT CONFIGURATION
# =========================================================

admin.payments.methods=${ADMIN_PAYMENT_METHODS:UPI,CARD,NETBANKING}

admin.payments.gateway-name=${ADMIN_PAYMENT_GATEWAY:PRIMARY_GATEWAY}

admin.payments.return-url=${ADMIN_PAYMENT_RETURN_URL:http://localhost:5173/admin/bookings/payment-return}

