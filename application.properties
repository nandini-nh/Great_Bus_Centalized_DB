admin.payments.allowed-return-origins=${ADMIN_PAYMENT_RETURN_ORIGINS:}


# =========================================================
# 23. UPI CONFIGURATION
# =========================================================

admin.payments.upi.payee-vpa=${UPI_PAYEE_VPA:}

