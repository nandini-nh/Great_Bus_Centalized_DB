tracking.events.geofence-event-topic=tracking.geofence.event
tracking.events.connectivity-topic=tracking.device.connectivity
tracking.events.schedule-updated-topic=schedule.updated
tracking.events.schema-version=1.0

# Public tracking
tracking.security.public-position-read=${PUBLIC_POSITION_READ:true}

# User Service
tracking.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
tracking.user-service.client-id=${USER_SERVICE_CLIENT_ID:tracking-service}
tracking.user-service.service-secret=${SERVICE_CLIENT_TRACKING_SECRET}
tracking.user-service.connect-timeout=PT2S
tracking.user-service.read-timeout=PT3S

# Fleet Service
tracking.fleet.base-url=${FLEET_SERVICE_URL:http://localhost:8082}
tracking.fleet.service-token=${FLEET_SERVICE_TOKEN:}
tracking.fleet.client-id=${FLEET_CLIENT_ID:tracking-service}
tracking.fleet.cache-ttl=PT15M
tracking.fleet.connect-timeout=PT2S
tracking.fleet.read-timeout=PT3S

# CORS
tracking.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Security
security.strict-secrets=${SECURITY_STRICT_SECRETS:}
security.guarded-properties=${SECURITY_GUARDED_PROPERTIES:tracking.user-service.service-secret}
security.insecure-markers=${SECURITY_INSECURE_MARKERS:CHANGE_ME,local-dev-only,dev-only,changeme}

# =====================================================
# SHIPMENT SERVICE CONFIGURATION
# =====================================================

# Server
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=3000

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway - Dedicated Shipment History
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=${FLYWAY_HISTORY_TABLE:flyway_schema_history_shipment}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Redisson
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2

# Redis
shipment.redis.address=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
management.health.redis.enabled=false

# JWT / Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:GB-user-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:greatbus-api}

# CORS
shipment.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3003}

# Pricing
shipment.pricing.version=${PRICING_VERSION:V1}
shipment.pricing.volumetric-divisor=5000
shipment.pricing.weight-rounding-kg=0.5
shipment.pricing.gst-rate-percent=18.00
shipment.pricing.tax-inclusive=true
shipment.pricing.express-as-addon=true
shipment.pricing.default-distance-km=600
shipment.pricing.intra-city-distance-km=25

# Quote and Payment
shipment.quote.ttl=PT30M
shipment.payment.deadline=PT15M
shipment.payment.sweep-interval-ms=30000

# Delivery
shipment.delivery.standard-km-per-day=400
shipment.delivery.express-km-per-day=700
shipment.delivery.cutoff-hour=18
shipment.delivery.zone=Asia/Kolkata

# Shipment Limits
shipment.limits.max-packages=20
shipment.limits.max-package-weight-kg=50
shipment.limits.max-shipment-weight-kg=200
shipment.limits.max-preferred-delivery-days-ahead=90

# Cancellation
shipment.cancellation.confirmed-fee-percent=10.00
shipment.cancellation.picked-up-fee-percent=50.00

# Payment Refund Service
shipment.payment-service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8084/api/v1}
shipment.payment-service.connect-timeout=PT2S
shipment.payment-service.read-timeout=PT5S

# User Service
shipment.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
shipment.user-service.client-id=shipment-service
shipment.user-service.service-secret=${SERVICE_CLIENT_SHIPMENT_SECRET:}

# Kafka
shipment.kafka.enabled=${KAFKA_ENABLED:false}
shipment.kafka.payment-succeeded-topic=payment.succeeded
shipment.kafka.relay-batch-size=200
shipment.kafka.relay-max-attempts=5
shipment.kafka.relay-interval-ms=5000
shipment.kafka.schema-version=1.0

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.parser.strict-duplicate-detection=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=shipment-service

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# Logging
logging.level.com.enterprise.shipment=${LOG_LEVEL:INFO}

# Account Deletion Events
shipment.kafka.account-deletion-requested-topic=account.deletion.requested
shipment.kafka.account-deletion-completed-topic=account.deletion.completed
# Notification Service
notification.provider.email[0]=emailProvider
notification.provider.sms[0]=snsSmsProvider
notification.provider.sms[1]=smsProvider
notification.provider.push[0]=pushProvider
notification.provider.whatsapp[0]=whatsappProvider
notification.provider.whatsapp[1]=whatsappBackupProvider

notification.bulk.batch-size=${NOTIFICATION_BULK_BATCH_SIZE:1000}
notification.bulk.max-pages-per-campaign=${NOTIFICATION_BULK_MAX_PAGES_PER_CAMPAIGN:1000}

notification.alerts.platform-email=${NOTIFICATION_PLATFORM_ALERT_EMAIL:}
notification.alerts.geofence-topic=${NOTIFICATION_GEOFENCE_TOPIC:tracking.geofence.event}