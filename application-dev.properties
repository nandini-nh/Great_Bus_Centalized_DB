# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.table=flyway_schema_history_user

# Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# Security
security.client.approved-ids=api-gateway,user-service,web-client,mobile-client,notification-service,discount-loyalty-service,booking-service,tracking-service,operator-operations-service,reporting-service,admin-console-service,support-service,admin-operator-service

# User Service URL for Feign Client For User Service
user-service.url=http://localhost:8081


# Notification Service - Flyway configuration
spring.flyway.table=flyway_schema_history_notification


# ==========================================
# TWILIO COMMON CONFIGURATION
# ==========================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}

# ==========================================
# TWILIO SMS CONFIGURATION
# ==========================================
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# ==========================================
# TWILIO WHATSAPP CONFIGURATION
# ==========================================
twilio.whatsapp.from-number=${TWILIO_WHATSAPP_FROM_NUMBER:}
twilio.whatsapp.sandbox-content-sid=${TWILIO_WHATSAPP_SANDBOX_CONTENT_SID:}

